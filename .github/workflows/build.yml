name: 构建模组构件

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gh_proxy:
        description: 'GitHub 资源镜像前缀（留空使用 gh-proxy.com）'
        type: string
        default: 'https://gh-proxy.com'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_PROXY: ${{ inputs.gh_proxy || 'https://gh-proxy.com' }}
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build & upload jar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 仓库自带的 wrapper 指向 services.gradle.org，最终会跳到 GitHub Release。
      # 这里只在 CI 副本里把下载地址换成 gh-proxy 镜像，不改仓库文件；镜像不可达时自动回退官方源。
      - name: Gradle 发行版走 gh-proxy 镜像
        shell: bash
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          official=$(sed -n 's/^distributionUrl=//p' "$props" | tr -d '\\')
          file=$(basename "$official")
          ver=${file#gradle-}
          ver=${ver%-bin.zip}
          mirror="${GH_PROXY%/}/https://github.com/gradle/gradle-distributions/releases/download/v${ver}/${file}"
          if curl -fsIL --connect-timeout 15 "$mirror" > /dev/null; then
            echo "使用镜像: $mirror"
            sed -i "s|^distributionUrl=.*|distributionUrl=${mirror}|" "$props"
            # 换成第三方地址后需关闭官方域名校验
            sed -i 's/^validateDistributionUrl=.*/validateDistributionUrl=false/' "$props"
          else
            echo "镜像不可用，继续使用官方源: $official"
          fi
          cat "$props"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 环境信息
        run: |
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: 构建
        run: ./gradlew build --no-daemon --stacktrace

      # 只挑主 jar，验证它确实是 zip/jar 且含 .class，再放进干净的 dist/ 供上传和发版。
      # 这样 Artifacts 里不会再出现任何日志/空壳文件，内容也会打印在日志里方便核对。
      - name: 校验并整理构件
        shell: bash
        run: |
          set -euo pipefail
          echo "== build/libs 原始内容 =="
          ls -lah build/libs/
          mkdir -p dist
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar')
          if (( ${#JARS[@]} == 0 )); then
            echo "::error::build/libs 里没有主 jar，构建产物异常"
            exit 1
          fi
          for j in "${JARS[@]}"; do
            echo "== 校验 $j =="
            unzip -t "$j" | tail -3
            if ! unzip -l "$j" | grep -q '\.class$'; then
              echo "::error::$j 里没有任何 .class，疑似空壳或日志文件，拒绝上传"
              exit 1
            fi
            unzip -l "$j" | tail -20
            cp "$j" dist/
          done
          echo "== 待发布构件 =="
          ls -lah dist/

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: create-aeronautics-fabric-${{ github.run_number }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      # 构建成功即自动发布：push main / 手动运行 -> build-<运行号> 预发布；推 v* tag -> 正式 Release。
      # PR 不发布（其 token 只读）。同名 Release 已存在时只覆盖附件，不重复创建。
      - name: 自动发布 Release
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$TAG"
            EXTRA=()
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            TITLE="Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"
            EXTRA=(--prerelease)
          fi
          mapfile -t JARS < <(find dist -maxdepth 1 -type f -name '*.jar')
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" "${JARS[@]}" --title "$TITLE" --generate-notes "${EXTRA[@]}"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
